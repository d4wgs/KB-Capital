name: Update portfolio data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

# Least privilege: the job only needs to push the refreshed data files.
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (not moving tags) so a hijacked tag can't run code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Pull Polymarket data
        env:
          # Public wallet address. Set under Settings > Secrets and variables > Actions > Variables.
          WALLET_ADDRESS: ${{ vars.WALLET_ADDRESS }}
          # Optional: hide the newest trades from the public feed (hours). Default 0.
          TRADE_DELAY_HOURS: ${{ vars.TRADE_DELAY_HOURS }}
        run: python scripts/update.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name  "kbcap-bot"
          git config user.email "kbcap-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Retry in case someone pushed while this job was running.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
